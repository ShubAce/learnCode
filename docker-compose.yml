services:
    postgres:
        image: postgres:17
        container_name: learncode_build
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres123
            POSTGRES_DB: learnCode
        ports:
            - "5432:5432"
        volumes:
            - learnCode_db_data:/var/lib/postgresql/data
        restart: unless-stopped

    # Optional self-hosted code runner — start with `npm run piston:up`, then `npm run piston:setup`
    piston:
        image: ghcr.io/engineer-man/piston
        container_name: learncode_piston
        profiles: ["piston"]
        privileged: true
        ports:
            - "2000:2000"
        volumes:
            - piston_packages:/piston/packages
        tmpfs:
            - /piston/jobs:exec,uid=1000,gid=1000,mode=711
            - /tmp:exec
        restart: unless-stopped

volumes:
    learnCode_db_data:
    piston_packages:
